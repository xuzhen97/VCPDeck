[package]
name = "desktop-core"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }
webrtc = { version = "0.21.0-rc.2", default-features = false, features = ["runtime-tokio", "crypto-ring"] }
rtc = { version = "0.21.0-rc.2", default-features = false }
tokio = { version = "1", features = ["rt", "sync", "time"] }
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time", "sync"] }
webrtc = { version = "0.21.0-rc.2", default-features = false, features = ["runtime-tokio", "crypto-ring"] }
